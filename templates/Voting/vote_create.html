{% extends 'base.html' %}
{% block content %}
<h1>Створити голосованя</h1>
<form method="post" action="{% url 'voting:vote-create' %}">
    {% csrf_token %}
    <p>title: {{ form.title }}</p>
    <p>description: {{ form.description }}</p>
    <p>choices:</p>
    {{ form_set.management_form }}
    {% for choices in form_set %}
        <p>{{ choices.text }}</p>
    {% endfor %}
    <button class="btn btn-primary" type="submit">создати</button>
</form>
{% endblock %}
